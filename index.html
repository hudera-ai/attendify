<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUDERA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>/* HUDERA AI design system
   Layout: product-led marketing site. Every project opens a full product page with a live demo
   inside a browser and/or phone frame. One token set drives the site, the apps and the frames. */
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#F0F2F8; --surface-3:#E9ECF5;
  --ink:#0B1220; --text:#1F2637; --muted:#5B6478; --faint:#8A93A6; --line:#E3E7F0; --line-2:#D5DAE6;
  --primary:#3D5AFE; --primary-ink:#2C46E6; --primary-soft:#E9EDFF; --on-primary:#FFFFFF;
  --mint:#0FA97A; --mint-soft:#DDF6EC; --amber:#C77700; --amber-soft:#FFF0D6; --red:#D9363E; --red-soft:#FDE6E7;
  --violet:#6E56CF; --violet-soft:#EEEAFB; --sky:#0B83C5; --sky-soft:#E0F1FB;
  --chart-1:#3D5AFE; --chart-2:#0FA97A; --chart-3:#F2A33A; --chart-4:#A3ADC4;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 24px 48px -18px rgba(16,24,40,.28),0 8px 18px -10px rgba(16,24,40,.12);
  --r-sm:6px; --r:10px; --r-lg:16px; --r-xl:22px;
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --f-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F1A; --surface:#111827; --surface-2:#161F31; --surface-3:#1C2740;
  --ink:#F3F6FC; --text:#DCE2EE; --muted:#9AA4BA; --faint:#6F7A91; --line:#232D42; --line-2:#2E3A54;
  --primary:#7088FF; --primary-ink:#8EA0FF; --primary-soft:#1B2450; --on-primary:#0A0F1A;
  --mint:#34D3A4; --mint-soft:#0F3328; --amber:#FFC34D; --amber-soft:#3A2C0B; --red:#FF7A80; --red-soft:#3D1A1D;
  --violet:#A996FF; --violet-soft:#29214A; --sky:#5CC2F2; --sky-soft:#0F2D40;
  --chart-1:#7088FF; --chart-2:#34D3A4; --chart-3:#FFC34D; --chart-4:#4A5672;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 24px 48px -18px rgba(0,0,0,.7),0 8px 18px -10px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F1A; --surface:#111827; --surface-2:#161F31; --surface-3:#1C2740;
  --ink:#F3F6FC; --text:#DCE2EE; --muted:#9AA4BA; --faint:#6F7A91; --line:#232D42; --line-2:#2E3A54;
  --primary:#7088FF; --primary-ink:#8EA0FF; --primary-soft:#1B2450; --on-primary:#0A0F1A;
  --mint:#34D3A4; --mint-soft:#0F3328; --amber:#FFC34D; --amber-soft:#3A2C0B; --red:#FF7A80; --red-soft:#3D1A1D;
  --violet:#A996FF; --violet-soft:#29214A; --sky:#5CC2F2; --sky-soft:#0F2D40;
  --chart-1:#7088FF; --chart-2:#34D3A4; --chart-3:#FFC34D; --chart-4:#4A5672;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 24px 48px -18px rgba(0,0,0,.7),0 8px 18px -10px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
h1,h2,h3,h4{color:var(--ink);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.ar{font-family:var(--f-ar)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.container{max-width:1200px;margin-inline:auto;padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
:root[data-theme="dark"] .btn.primary{color:var(--on-primary)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:var(--on-primary)}}
.btn.primary:hover{background:var(--primary-ink);border-color:var(--primary-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px;gap:6px}
.btn.xs{height:26px;padding:0 9px;font-size:12px;border-radius:7px;gap:5px}
.btn svg{width:16px;height:16px;flex:none}
.btn.sm svg,.btn.xs svg{width:14px;height:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.5}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-blue{background:var(--primary-soft);color:var(--primary-ink)} .c-mint{background:var(--mint-soft);color:var(--mint)}
.c-amber{background:var(--amber-soft);color:var(--amber)} .c-red{background:var(--red-soft);color:var(--red)}
.c-violet{background:var(--violet-soft);color:var(--violet)} .c-sky{background:var(--sky-soft);color:var(--sky)} .c-grey{background:var(--surface-2);color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-ink);font-weight:500}

/* ---------- nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.nav .container{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo svg{width:32px;height:32px}
.logo b{font-family:var(--f-display);font-size:23px;font-weight:700;letter-spacing:-.02em}
.logo span{font-family:var(--f-display);font-size:23px;font-weight:400;color:var(--faint);margin-inline-start:-4px}
.nav-links{display:flex;gap:4px;margin-inline-start:auto}
.nav-links a{font-size:14.5px;font-weight:500;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:8px}
.nav-links a:hover{color:var(--ink);background:var(--surface-2)}
.theme-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.theme-btn svg{width:18px;height:18px}

/* ---------- hero ---------- */
.hero{padding-block:72px 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:48px;align-items:center}
.hero h1{font-family:var(--f-display);font-size:clamp(38px,5.2vw,64px);font-weight:700;letter-spacing:-.035em;line-height:1.02;margin-top:16px}
.hero h1 .hl{color:var(--primary)}
.hero .lead{font-size:clamp(17px,1.6vw,19px);color:var(--muted);margin-top:20px;max-width:34em}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .proof{display:flex;gap:18px;flex-wrap:wrap;margin-top:32px;font-size:13.5px;color:var(--muted)}
.hero .proof span{display:inline-flex;align-items:center;gap:7px}
.hero .proof svg{width:16px;height:16px;color:var(--mint)}
.hero-stage{display:flex;gap:22px;align-items:flex-start}
#hero-phone{flex:none;order:-1}
.hero-stage .phone{width:262px}
.hero-stage .browser{flex:1;min-width:0;margin-top:46px}

/* ---------- section scaffolding ---------- */
section{scroll-margin-top:80px}
.sec{padding-block:88px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.sec-head h2{font-family:var(--f-display);font-size:clamp(28px,3.4vw,42px);font-weight:700;letter-spacing:-.025em;margin-top:10px}
.sec-head p{color:var(--muted);max-width:40em;margin-top:12px;font-size:17px}
.band{background:var(--surface);border-block:1px solid var(--line)}

.industries{display:flex;gap:10px 28px;flex-wrap:wrap;align-items:center;padding-block:22px;color:var(--muted);font-size:14px}
.industries b{color:var(--ink);font-weight:600;margin-inline-end:6px}
.industries span{display:inline-flex;align-items:center;gap:8px}
.industries svg{width:16px;height:16px;color:var(--faint)}

.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:10px}
.svc .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-ink)}
.svc .ico svg{width:20px;height:20px}
.svc h3{font-size:17px;font-weight:650}
.svc p{font-size:14.5px;color:var(--muted);line-height:1.55}
.svc .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.svc .links a{font-size:12.5px;color:var(--primary-ink);text-decoration:none;font-weight:600}
.svc .links a:hover{text-decoration:underline}

/* ---------- product grid ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:550;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab .n{font-family:var(--f-mono);font-size:12px;opacity:.7;margin-inline-start:6px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s,transform .2s}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.pcard .preview{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--surface-2);border-bottom:1px solid var(--line);cursor:pointer}
.pcard .preview-canvas{position:absolute;inset-inline-start:0;top:0;width:1200px;height:750px;transform-origin:top left;transform:scale(var(--s,.45));pointer-events:none}
[dir="rtl"] .pcard .preview-canvas{transform-origin:top right}
.pcard .body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.pcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.pcard h3{font-family:var(--f-display);font-size:23px;font-weight:700;letter-spacing:-.02em}
.pcard p{color:var(--muted);font-size:15px}
.pcard .foot{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.pcard .feat{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pcard .feat span{display:inline-flex;gap:6px;align-items:center}
.pcard .feat svg{width:14px;height:14px;color:var(--mint)}
.pcard.featured{grid-column:1/-1}
.pcard.featured .preview{aspect-ratio:21/9}

/* ---------- process ---------- */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;position:relative}
.step .k{font-family:var(--f-mono);font-size:12px;color:var(--primary-ink)}
.step h3{font-size:18px;margin-top:10px}
.step p{font-size:14.5px;color:var(--muted);margin-top:8px}
.step .tag{display:inline-block;margin-top:14px}
.principles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:22px}
.principles div{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--muted)}
.principles svg{width:20px;height:20px;color:var(--primary-ink);flex:none;margin-top:2px}
.principles b{color:var(--ink);display:block;font-weight:600}

/* ---------- contact ---------- */
.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;background:var(--ink);color:#C9D1E3;border-radius:28px;padding:48px;align-items:start}
:root[data-theme="dark"] .contact{background:var(--surface-2);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .contact{background:var(--surface-2);color:var(--muted)}}
.contact h2{font-family:var(--f-display);color:#fff;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.025em}
:root[data-theme="dark"] .contact h2{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .contact h2{color:var(--ink)}}
.contact .list{display:flex;flex-direction:column;gap:12px;margin-top:24px;font-size:15px}
.contact .list>span,.contact .list>a{display:flex;gap:10px;align-items:center}.contact .list a:hover{text-decoration:underline}
.contact .list svg{width:18px;height:18px;color:#7DE3C3}
.form{background:var(--surface);color:var(--text);border-radius:var(--r-lg);padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink)}
.input,.select,textarea.input{height:40px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--text);padding:0 12px;font:inherit;font-size:14.5px;width:100%;min-width:0}
textarea.input{height:auto;min-height:92px;padding:10px 12px;resize:vertical}
.input:focus,.select:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
.brief{grid-column:1/-1;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:14px;font-size:14px;white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;line-height:1.6}

footer.site{padding-block:36px 48px;color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:72px}
footer.site p{max-width:62em}

/* ---------- product page ---------- */
.pview{padding-block:28px 40px}
.crumbs{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.crumbs a:hover{color:var(--ink)}
.crumbs svg{width:16px;height:16px}
.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-top:22px}
.phead h1{font-family:var(--f-display);font-size:clamp(34px,4.4vw,54px);letter-spacing:-.03em;font-weight:700;margin-top:10px}
.phead .tag{font-size:clamp(17px,1.6vw,20px);color:var(--muted);margin-top:12px;max-width:40em}
.phead .acts{display:flex;gap:10px;flex-wrap:wrap}
.demo-wrap{margin-top:32px;background:var(--surface-2);border:1px solid var(--line);border-radius:28px;padding:28px;position:relative;overflow:hidden}
.demo-wrap::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:22px 22px;opacity:.6;pointer-events:none}
.demo-wrap>*{position:relative}
.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.demo-bar .hint{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.demo-bar .hint svg{width:16px;height:16px;color:var(--primary-ink)}
.demo-bar .ctl{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;height:28px;padding:0 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:40px}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.pbox h3{font-size:13px;font-family:var(--f-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--primary-ink)}
.pbox p{margin-top:10px;color:var(--text);font-size:15.5px}
.features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.feature{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.feature .ico{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-ink)}
.feature .ico svg{width:18px;height:18px}
.feature b{display:block;color:var(--ink);font-size:15px}
.feature span{font-size:14px;color:var(--muted)}
.flowline{display:flex;align-items:stretch;gap:0;margin-top:18px;overflow-x:auto;padding-bottom:4px}
.flowstep{flex:1 0 170px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative}
.flowstep small{font-family:var(--f-mono);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.flowstep b{display:block;font-size:14.5px;color:var(--ink);margin-top:4px}
.flowstep span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.flowarrow{flex:0 0 28px;display:grid;place-items:center;color:var(--faint)}
.flowarrow svg{width:18px;height:18px}
.stack{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cta-band{margin-top:40px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:26px 28px}
.cta-band h3{font-family:var(--f-display);font-size:24px;letter-spacing:-.02em}
.cta-band p{color:var(--muted);margin-top:6px}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.pnav a{display:flex;flex-direction:column;text-decoration:none;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0;flex:1}
.pnav a small{color:var(--faint);font-size:12.5px}
.pnav a b{color:var(--ink);font-size:15.5px}
.pnav a:last-child{text-align:end}
.h-sub{font-family:var(--f-display);font-size:24px;letter-spacing:-.02em;margin-top:44px}

/* ---------- device frames ---------- */
.browser{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;min-width:0}
.browser-bar{display:flex;align-items:center;gap:12px;height:38px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.browser-bar .dots{display:flex;gap:6px}
.browser-bar .dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.browser-bar .url{flex:1;max-width:420px;margin-inline:auto;height:24px;border-radius:7px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:var(--muted);font-family:var(--f-mono);overflow:hidden;white-space:nowrap}
.browser-bar .url svg{width:12px;height:12px;flex:none;color:var(--mint)}
.browser-bar .sp{width:46px}

.phone{position:relative;width:300px;max-width:100%;aspect-ratio:300/620;background:#0B0D12;border-radius:46px;padding:11px;box-shadow:var(--shadow-lg),inset 0 0 0 2px #2A2E38;flex:none}
.phone::after{content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);width:92px;height:26px;border-radius:14px;background:#0B0D12;z-index:3}
.phone .screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#EFEAE2;display:flex;flex-direction:column;color:#111B21;font-family:var(--f-body)}
/* chat app (WhatsApp-style layout, light theme kept constant inside the device) */
.wa-status{height:40px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 4px;font-size:13px;font-weight:600;background:#F0F2F5;color:#111B21}
.wa-status .icons{display:flex;gap:5px;align-items:center}
.wa-status svg{width:15px;height:15px}
.wa-head{flex:none;display:flex;align-items:center;gap:9px;padding:6px 10px 8px;background:#F0F2F5;border-bottom:1px solid #D9DDE1}
.wa-head .back{width:18px;height:18px;color:#3B4A54}
.wa-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.wa-head .who{flex:1;min-width:0;line-height:1.2}
.wa-head .who b{display:flex;align-items:center;gap:4px;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-head .who b svg{width:14px;height:14px;color:#1DA1F2;flex:none}
.wa-head .who span{font-size:11.5px;color:#667781;white-space:nowrap}
.wa-head .tools{display:flex;gap:14px;color:#3B4A54}
.wa-head .tools svg{width:19px;height:19px}
.wa-body{flex:1;overflow-y:auto;padding:10px 9px 12px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth;
  background-color:#EFEAE2;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.2px);background-size:14px 14px}
.wa-body::-webkit-scrollbar{width:0}
.wa-day{align-self:center;background:#FFFFFF;color:#54656F;font-size:11px;padding:3px 9px;border-radius:7px;margin:4px 0 6px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.wa-note{align-self:center;background:#FFF5C4;color:#54656F;font-size:10.5px;padding:5px 9px;border-radius:7px;margin-bottom:6px;text-align:center;max-width:92%;line-height:1.4}
.wa-msg{max-width:84%;padding:5px 8px 4px;border-radius:8px;font-size:13.5px;line-height:1.42;box-shadow:0 1px .5px rgba(11,20,26,.13);position:relative;white-space:pre-line;word-wrap:break-word;margin-top:4px;animation:pop .22s ease-out both}
.wa-msg.in{align-self:flex-start;background:#FFFFFF;border-top-left-radius:2px}
.wa-msg.out{align-self:flex-end;background:#D9FDD3;border-top-right-radius:2px}
[dir="rtl"] .wa-msg.in,.wa-rtl .wa-msg.in{border-top-left-radius:8px;border-top-right-radius:2px}
[dir="rtl"] .wa-msg.out,.wa-rtl .wa-msg.out{border-top-right-radius:8px;border-top-left-radius:2px}
.wa-rtl .wa-msg.in{align-self:flex-start}
.wa-rtl .wa-msg.out{align-self:flex-end}
.wa-msg .auto{display:flex;align-items:center;gap:4px;font-size:10.5px;color:#00A884;font-weight:600;margin-bottom:2px}
.wa-msg .auto svg{width:11px;height:11px}
.wa-msg .meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:10.5px;color:#667781;margin-top:1px;float:right;margin-inline-start:10px;position:relative;top:4px;direction:ltr}
.wa-msg .meta svg{width:15px;height:15px;color:#53BDEB}
.wa-msg::after{content:"";display:block;clear:both}
.wa-msg.typing{display:flex;gap:4px;padding:10px 12px}
.wa-msg.typing i{width:6px;height:6px;border-radius:50%;background:#8696A0;animation:blink 1s infinite}
.wa-msg.typing i:nth-child(2){animation-delay:.15s}.wa-msg.typing i:nth-child(3){animation-delay:.3s}
.wa-btns{display:flex;flex-direction:column;gap:3px;max-width:84%;align-self:flex-start;width:84%;margin-top:2px}
.wa-btns button{background:#FFFFFF;border:0;border-radius:8px;height:34px;color:#027EB5;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:0 1px .5px rgba(11,20,26,.13);display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.wa-btns button svg{width:14px;height:14px}
.wa-btns button:hover:not([disabled]){background:#F5F6F6}
.wa-btns button[disabled]{color:#8696A0;cursor:default}
.wa-btns button.picked{color:#00A884}
.wa-doc{display:flex;align-items:center;gap:9px;background:#F5F6F6;border-radius:6px;padding:8px;margin:2px 0 3px;min-width:200px}
.wa-doc .ic{width:30px;height:36px;border-radius:4px;background:#E53935;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;flex:none}
.wa-doc b{display:block;font-size:12.5px;font-weight:600;color:#111B21;direction:ltr;text-align:start}
.wa-doc span{font-size:11px;color:#667781}
.wa-img{width:190px;height:130px;border-radius:6px;margin:1px 0 3px;position:relative;overflow:hidden;background:linear-gradient(135deg,#D7CDBE 0%,#B9A991 38%,#8C7B65 100%)}
.wa-img::before{content:"";position:absolute;left:12%;right:12%;top:46%;height:12%;background:#EDE7DE;border-radius:2px;box-shadow:0 18px 0 -2px #CFC4B4}
.wa-img::after{content:"";position:absolute;left:18%;top:14%;width:26%;height:26%;background:#F3EEE6;border-radius:3px;box-shadow:70px 0 0 0 #F3EEE6}
.wa-img.receipt{background:linear-gradient(180deg,#FFFFFF,#F2F2F2)}
.wa-img.receipt::before{left:14%;right:14%;top:16%;height:6%;background:#C9D2DB;box-shadow:0 16px 0 #E1E6EB,0 32px 0 #E1E6EB,0 48px 0 #E1E6EB,0 70px 0 #00A884}
.wa-img.receipt::after{display:none}
.wa-img .cap{position:absolute;bottom:5px;inset-inline-end:7px;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);z-index:2;direction:ltr}
.wa-img.receipt .cap{color:#667781;text-shadow:none}
.wa-input{flex:none;display:flex;align-items:center;gap:7px;padding:7px 8px 18px;background:#F0F2F5}
.wa-input .box{flex:1;height:36px;border-radius:18px;background:#FFFFFF;display:flex;align-items:center;gap:8px;padding:0 11px;color:#8696A0;font-size:13.5px}
.wa-input .box svg{width:19px;height:19px;color:#54656F;flex:none}
.wa-input .box span{flex:1}
.wa-input .mic{width:36px;height:36px;border-radius:50%;background:#00A884;display:grid;place-items:center;color:#fff;flex:none}
.wa-input .mic svg{width:18px;height:18px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- app shell (demo products) ---------- */
.app{display:grid;grid-template-columns:200px minmax(0,1fr);height:640px;background:var(--bg);font-size:13.5px;color:var(--text)}
.app.compact{grid-template-columns:58px minmax(0,1fr)}
.app-side{background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px;min-width:0}
.app-brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;color:var(--ink);font-size:14.5px;white-space:nowrap;overflow:hidden}
.app-brand i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.app-brand i svg{width:15px;height:15px}
.app-side button.nv{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:13.5px;font-weight:550;cursor:pointer;text-align:start;white-space:nowrap}
.app-side button.nv svg{width:17px;height:17px;flex:none}
.app-side button.nv:hover{background:var(--surface-2);color:var(--ink)}
.app-side button.nv[aria-current="page"]{background:var(--primary-soft);color:var(--primary-ink)}
.app-side button.nv .badge{margin-inline-start:auto;font-size:11px;font-weight:700;background:var(--red);color:#fff;border-radius:999px;padding:0 6px;line-height:18px}
.app-side .who{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px 2px;border-top:1px solid var(--line);font-size:12.5px;min-width:0}
.app-side .who i{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:11px;color:var(--ink);flex:none}
.app-side .who b{display:block;color:var(--ink);font-weight:600;white-space:nowrap}
.app-side .who span{color:var(--faint);font-size:11.5px}
.app-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.app-top{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.app-top h4{font-size:15.5px;font-weight:650;white-space:nowrap}
.app-top .sp{flex:1}
.app-top .srch{display:flex;align-items:center;gap:7px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;color:var(--faint);background:var(--surface-2);min-width:0;width:220px}
.app-top .srch svg{width:15px;height:15px;flex:none}
.app-top .srch input{border:0;background:transparent;outline:0;font:inherit;font-size:13px;color:var(--text);width:100%;min-width:0}
.app-top .bell{position:relative;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.app-top .bell svg{width:16px;height:16px}
.app-top .bell i{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.app-body{flex:1;overflow:auto;padding:18px;min-height:0;display:flex;flex-direction:column;gap:16px}
.app-body::-webkit-scrollbar{width:8px;height:8px}.app-body::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g-span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h5{font-size:13.5px;font-weight:650;color:var(--ink);margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .sub{font-size:12px;color:var(--faint);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi small{font-size:12px;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:6px}
.kpi small svg{width:14px;height:14px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12px;color:var(--faint)}
.kpi .up{color:var(--mint);font-weight:600}.kpi .down{color:var(--red);font-weight:600}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:start;font-weight:600;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--surface-2)}
table.t tr.sel td{background:var(--primary-soft)}
table.t td.r,table.t th.r{text-align:end;font-variant-numeric:tabular-nums}
table.t .strong{color:var(--ink);font-weight:600}
table.t .faint{color:var(--faint)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none;vertical-align:middle}
.person{display:inline-flex;align-items:center;gap:8px}
.bar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--mint)}
.bar i.w{background:var(--amber)}.bar i.b{background:var(--red)}.bar i.p{background:var(--primary)}
.empty{padding:28px;text-align:center;color:var(--faint);font-size:13px}
.select.sm,.input.sm{height:32px;font-size:13px;width:auto;padding:0 10px;border-radius:8px}
.toggle{position:relative;width:36px;height:20px;border-radius:999px;background:var(--line-2);border:0;cursor:pointer;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-checked="true"]{background:var(--mint)}
.toggle[aria-checked="true"]::after{inset-inline-start:18px}
.log{display:flex;flex-direction:column;gap:0}
.log .it{display:grid;grid-template-columns:18px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px;align-items:start;animation:pop .25s ease-out both}
.log .it:last-child{border-bottom:0}
.log .it svg{width:15px;height:15px;margin-top:2px}
.log .it b{color:var(--ink);font-weight:600}
.log .it time{font-family:var(--f-mono);font-size:11px;color:var(--faint);white-space:nowrap}
.drawer{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(400px,92%);background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:5;display:flex;flex-direction:column;animation:slide .22s ease-out both}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h5{font-size:15px;color:var(--ink);margin:0}
.drawer header small{color:var(--faint);font-size:12px;font-family:var(--f-mono)}
.drawer .db{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.drawer footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink);font-weight:550;text-align:end}
.x-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.x-btn svg{width:15px;height:15px}
.quote{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;border-inline-start:3px solid var(--mint)}
.quote small{display:block;color:var(--faint);font-size:11.5px;margin-bottom:2px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:550;z-index:100;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center;animation:pop .2s ease-out both;max-width:calc(100vw - 32px)}
.toast svg{width:16px;height:16px;color:var(--mint)}
.pipeline{display:flex;flex-direction:column;gap:10px}
.pipe{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
.pipe .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.pipe.done .st{background:var(--mint);border-color:var(--mint);color:#fff}
.pipe.run .st{border-color:var(--primary);border-top-color:transparent;animation:spin .7s linear infinite}
.pipe.done{color:var(--ink)}
.pipe .st svg{width:13px;height:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;min-height:0}
.kcol{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol header{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:650;color:var(--ink);padding:2px 4px}
.kcol header span{font-family:var(--f-mono);color:var(--faint);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:start;font-size:12.5px;width:100%}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.kcard b{color:var(--ink);font-size:13px;font-weight:600}
.kcard .row{gap:6px}
.nodes{display:flex;align-items:center;gap:0;overflow-x:auto;padding:8px 2px 12px}
.node{flex:none;width:170px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow-sm)}
.node small{display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.node small i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff}
.node small i svg{width:11px;height:11px}
.node b{display:block;font-size:13px;color:var(--ink);margin-top:6px}
.node span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.node.off{opacity:.45}
.link{flex:none;width:34px;height:2px;background:var(--line-2);position:relative}
.link::after{content:"";position:absolute;inset-inline-end:-1px;top:-4px;border:5px solid transparent;border-inline-start:7px solid var(--line-2);border-inline-end:0}
.docprev{background:#fff;color:#1A2233;border-radius:8px;box-shadow:var(--shadow-sm);border:1px solid var(--line);padding:22px 24px;font-size:12.5px}
.docprev h6{font-size:16px;margin:0;color:#0B1220}
.docprev .dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0B1220;padding-bottom:10px;margin-bottom:12px;gap:12px}
.docprev .dh small{color:#5B6478;font-family:var(--f-mono);font-size:11px}
.docprev table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.docprev th{background:#F0F2F8;text-align:start;padding:6px 8px;font-weight:600;color:#3A4358}
.docprev td{padding:6px 8px;border-bottom:1px solid #E3E7F0}
.docprev .ph{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.docprev .ph i{aspect-ratio:4/3;border-radius:4px;background:linear-gradient(135deg,#B8C0CC,#7D8899);display:block;position:relative}
.docprev .ph i::after{content:attr(data-c);position:absolute;bottom:3px;left:5px;font-style:normal;font-size:9px;color:#fff}
.docprev .sig{display:flex;justify-content:space-between;margin-top:14px;color:#5B6478;font-size:11px;gap:10px;flex-wrap:wrap}
.stamp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;border:1.5px solid currentColor}
.thumb{width:44px;height:56px;border-radius:5px;background:#fff;border:1px solid var(--line-2);position:relative;flex:none;overflow:hidden}
.thumb::before{content:"";position:absolute;left:7px;right:7px;top:9px;height:3px;background:#C8CFDC;box-shadow:0 7px 0 #E2E6EE,0 14px 0 #E2E6EE,0 21px 0 #E2E6EE,0 28px 0 #E2E6EE}
.thumb.inv::after{content:"INV";position:absolute;bottom:3px;right:4px;font-size:8px;font-weight:700;color:var(--primary-ink)}
.thumb.dn::after{content:"DN";position:absolute;bottom:3px;right:4px;font-size:8px;font-weight:700;color:var(--mint)}
.thumb.id{background:linear-gradient(135deg,#E9EEF8,#D6DEEE)}

      g += `<rect x="${x}" y="${y}" width="${Math.max(1, bw - (stacked ? 0 : 2))}" height="${Math.max(0, bh)}" rx="${stacked ? 0 : 3}" fill="${col}"${hiIndex >= 0 && hiIndex !== i ? ' opacity=".45"' : ""}><title>${esc(lb)} · ${esc(s.name)}: ${fmt(v)}${unit}</title></rect>`;
      if (stacked) acc += bh;
    });
    if (labels.length <= 16 || i % 2 === 0) g += `<text x="${cx}" y="${h - 8}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${esc(lb)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg></div>`;
}
function lineChart({ labels, series, w = 560, h = 220, unit = "", max }) {
  const L = 38, R = 10, T = 12, B = 26, iw = w - L - R, ih = h - T - B;
  const m = max || niceMax(Math.max(...series.flatMap(s => s.data)) * 1.08);
  const X = i => L + (iw * i) / (labels.length - 1), Y = v => T + ih - (v / m) * ih;
  let g = [0, .25, .5, .75, 1].map(f => { const t = f * m, y = Y(t); return `<line x1="${L}" x2="${w - R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${t ? "3 3" : "0"}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="var(--faint)">${fmt(Math.round(t))}${unit}</text>`; }).join("");
  series.forEach((s, j) => {
    const d = s.data.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join("");
    if (s.area) g += `<path d="${d}L${X(s.data.length - 1)} ${T + ih}L${L} ${T + ih}Z" fill="${s.color}" opacity=".10"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" ${s.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = s.data.length - 1; g += `<circle cx="${X(li)}" cy="${Y(s.data[li])}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  labels.forEach((lb, i) => { if (labels.length <= 12 || i % Math.ceil(labels.length / 10) === 0) g += `<text x="${X(i)}" y="${h - 8}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${esc(lb)}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg></div>`;
}

/* App shell: sidebar navigation that really switches screens */
function appShell(root, cfg) {
  const st = { view: cfg.nav[0].id };
  root.innerHTML = `<div class="app">
    <aside class="app-side">
      <div class="app-brand"><i style="background:${cfg.color || "var(--primary)"}">${ic(cfg.icon || "grid")}</i><span>${esc(cfg.name)}</span></div>
      ${cfg.nav.map(n => `<button class="nv" type="button" data-nav="${n.id}">${ic(n.icon)}<span>${esc(n.label)}</span>${n.badge ? `<span class="badge" data-badge="${n.id}">${n.badge}</span>` : ""}</button>`).join("")}
      <div class="who"><i data-ini-ar="${esc(arIni(cfg.user[0]))}">${esc(initials(cfg.user[0]))}</i><div><b>${esc(cfg.user[0])}</b><span>${esc(cfg.user[1])}</span></div></div>
    </aside>
    <div class="app-main">
      <div class="app-top"><h4 data-title></h4><span class="sp"></span>${cfg.search !== false ? `<label class="srch">${ic("search")}<input type="search" placeholder="${esc(cfg.searchPh || "Search")}" aria-label="Search" data-search></label>` : ""}<span class="bell" aria-hidden="true">${ic("bell")}<i></i></span></div>
      <div class="app-body" data-body style="position:relative"></div>
    </div></div>`;
  const body = $("[data-body]", root), title = $("[data-title]", root), search = $("[data-search]", root);
  const api = {
    root, body, state: st, search: search ? { get value() { return searchQuery(search.value); } } : null,
    go(id) {
      st.view = id;
      $$("[data-nav]", root).forEach(b => b.setAttribute("aria-current", b.dataset.nav === id ? "page" : "false"));
      const n = cfg.nav.find(x => x.id === id); title.textContent = n.label;
      if (search) { search.value = ""; search.placeholder = n.searchPh || cfg.searchPh || "Search"; }
      body.scrollTop = 0; cfg.render[id](body, api);
    },
    refresh() { cfg.render[st.view](body, api); },
    badge(id, v) { const b = $(`[data-badge="${id}"]`, root); if (b) { b.textContent = v; b.hidden = !v; } },
    drawer(html, onMount) {
      $$(".drawer", body.parentElement).forEach(d => d.remove());
      const d = document.createElement("div"); d.className = "drawer"; d.innerHTML = html;
      body.parentElement.style.position = "relative"; body.parentElement.appendChild(d);
      d.addEventListener("click", e => { if (e.target.closest("[data-close]")) d.remove(); });
      onMount && onMount(d); return d;
    },
    closeDrawer() { $$(".drawer", body.parentElement).forEach(d => d.remove()); },
  };
  root.addEventListener("click", e => { const b = e.target.closest("[data-nav]"); if (b && root.contains(b)) { api.closeDrawer(); api.go(b.dataset.nav); } });
  if (search) search.addEventListener("input", () => { const n = cfg.nav.find(x => x.id === st.view); if (n.onSearch) n.onSearch(search.value.trim().toLowerCase(), body, api); });
  api.go(st.view);
  return api;
}

/* Chat engine: plays scripted steps; customer choices are real buttons that advance the script */
function chatEngine(chatEl, opts = {}) {
  const speed = opts.speed || 1;
  let alive = true, timers = [];
  const scroll = () => { chatEl.scrollTop = chatEl.scrollHeight; };
  const wait = ms => new Promise(r => { const t = setTimeout(r, ms / speed); timers.push(t); });
  const tick = side => side === "out" ? `<span class="meta">${now()}${ic("checks")}</span>` : `<span class="meta">${now()}</span>`;
  function bubble(m) {
    const d = document.createElement("div");
    d.className = `wa-msg ${m.side}`;
    let inner = "";
    if (m.auto) inner += `<span class="auto">${ic("bot")}${esc(m.autoLabel || "Automated reply")}</span>`;
    if (m.img) inner += `<div class="wa-img ${m.img === "receipt" ? "receipt" : ""}"><span class="cap">${esc(m.imgCap || "")}</span></div>`;
    if (m.doc) inner += `<div class="wa-doc"><span class="ic">PDF</span><div><b>${esc(m.doc)}</b><span>${esc(m.docMeta || "PDF")}</span></div></div>`;
    if (m.text) inner += esc(m.text).replace(/\*([^*]+)\*/g, "<b>$1</b>");
    d.innerHTML = inner + tick(m.side);
    chatEl.appendChild(d); scroll(); return d;
  }
  function typing() { const d = document.createElement("div"); d.className = "wa-msg in typing"; d.innerHTML = "<i></i><i></i><i></i>"; chatEl.appendChild(d); scroll(); return d; }
  function buttons(list) {
    return new Promise(res => {
      const w = document.createElement("div"); w.className = "wa-btns";
      w.innerHTML = list.map((b, i) => `<button type="button" data-i="${i}">${b.icon ? ic(b.icon) : ""}${esc(b.label)}</button>`).join("");
      chatEl.appendChild(w); scroll();
      w.addEventListener("click", e => {
        const b = e.target.closest("button"); if (!b || b.disabled) return;
        $$("button", w).forEach(x => { x.disabled = true; }); b.classList.add("picked");
        res(list[+b.dataset.i]);
      });
      if (opts.auto) { const t = setTimeout(() => { const pick = list.find(x => x.auto) || list[0]; const b = $$("button", w)[list.indexOf(pick)]; b && b.click(); }, 1500 / speed); timers.push(t); }
    });
  }
  return {
    async say(m) { if (!alive) return; if (m.side === "in") { const t = typing(); await wait(m.delay || 900); t.remove(); } else await wait(m.delay || 450); if (!alive) return; bubble(m); opts.onMessage && opts.onMessage(m); },
    buttons, wait, bubble,
    stop() { alive = false; timers.forEach(clearTimeout); },
    get alive() { return alive; },
    reset(head) { this.stop(); chatEl.innerHTML = head; },
  };
}

/* ================= i18n: Arabic / English =================
   The page is written in English. In Arabic mode every visible string is looked up in AR_DICT
   (exact text first, then a number-agnostic template where digits become "#").
   Chat bubbles inside the phone frames are never touched: they follow the chat's own language. */
let LANG = (() => { try { const v = localStorage.getItem("hudera-lang"); if (v === "en" || v === "ar") return v; } catch (e) {} return "ar"; })();
const tt = (en, ar) => (LANG === "ar" ? ar : en);
const L10N_SKIP = ".phone, .no-l10n, script, style";
const L10N_ATTRS = ["placeholder", "aria-label", "title", "data-c"];
const L10N_NUM = /\d+(?:[.,:\/]\d+)*/g;
const L10N_LATIN = /[A-Za-z]/;
const L10N_ARABIC = /[\u0600-\u06FF]/;
const L10N_ORIG = new WeakMap();
const L10N_MISSING = new Set();
const L10N_KEEP = new Set(["HUDERA", "AI", "HUDERA AI", "hudera", "SaaS", "WhatsApp", "PDF", "Excel", "CRM", "ERP", "API", "n8n", "OCR", "GPR", "KSA", "UAE", "VAT", "SLA", "ID", "OK"]);
let AR_T = null;
function l10nTemplates() {
  if (AR_T) return AR_T;
  AR_T = new Map();
  for (const k in AR_DICT) if (k.includes("#")) AR_T.set(k, AR_DICT[k]);
  return AR_T;
}
const l10nNorm = s => s.replace(/\s+/g, " ").trim();
function l10nLookup(raw) {
  const s = l10nNorm(raw);
  if (!s || !L10N_LATIN.test(s)) return null;
  if (Object.prototype.hasOwnProperty.call(AR_DICT, s)) return AR_DICT[s];
  const nums = s.match(L10N_NUM);
  if (nums) {
    const key = s.replace(L10N_NUM, "#");
    const tpl = l10nTemplates().get(key);
    if (tpl != null) {
      if (/\{\d\}/.test(tpl)) return tpl.replace(/\{(\d)\}/g, (_, i) => nums[+i] ?? "");
      let i = 0; return tpl.replace(/#/g, () => nums[i++] ?? "");
    }
  }
  return null;
}
function l10nText(node) {
  const v = node.nodeValue;
  if (!v || !L10N_LATIN.test(v) || L10N_ARABIC.test(v)) return;
  const p = node.parentElement;
  if (!p || p.closest(L10N_SKIP)) return;
  const tr = (p.dataset && p.dataset.iniAr) || l10nLookup(v);
  if (tr == null) { const s = l10nNorm(v); if (s && !L10N_KEEP.has(s) && !/^[A-Z]{1,5}-?[\d#]+$/.test(s)) L10N_MISSING.add(s); return; }
  if (!L10N_ORIG.has(node)) L10N_ORIG.set(node, v);
  const lead = v.match(/^\s*/)[0];
  /* a fragment ending in the Arabic conjunction "و" attaches to the next word */
  const trail = /(^|\s)و$/.test(tr) ? "" : v.match(/\s*$/)[0];
  if (p.tagName === "OPTION" && !p.hasAttribute("value")) p.setAttribute("value", p.textContent);
  const nv = lead + tr + trail;
  if (nv !== v) node.nodeValue = nv;
}
function l10nAttrs(el) {
  if (el.closest(L10N_SKIP)) return;
  for (const a of L10N_ATTRS) {
    const v = el.getAttribute(a);
    if (!v || !L10N_LATIN.test(v) || L10N_ARABIC.test(v)) continue;
    const tr = l10nLookup(v);
    if (tr == null) { L10N_MISSING.add(l10nNorm(v)); continue; }
    if (tr === v) continue;
    if (!el.hasAttribute("data-en-" + a)) el.setAttribute("data-en-" + a, v);
    el.setAttribute(a, tr);
  }
}
function localize(root) {
  if (LANG !== "ar" || !root) return;
  if (root.nodeType === 3) { l10nText(root); return; }
  if (root.nodeType !== 1 && root.nodeType !== 11) return;
  if (root.nodeType === 1) l10nAttrs(root);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: n => (n.nodeType === 1 && n.matches(L10N_SKIP)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  let n; while ((n = w.nextNode())) { if (n.nodeType === 3) l10nText(n); else l10nAttrs(n); }
}
/* restore the original English of static markup when switching back */
function unlocalize(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let n; while ((n = w.nextNode())) {
    if (n.nodeType === 3) { if (L10N_ORIG.has(n)) { n.nodeValue = L10N_ORIG.get(n); L10N_ORIG.delete(n); } }
    else for (const a of L10N_ATTRS) { const o = n.getAttribute("data-en-" + a); if (o != null) { n.setAttribute(a, o); n.removeAttribute("data-en-" + a); } }
  }
}
const L10N_OBS = new MutationObserver(recs => {
  if (LANG !== "ar") return;
  for (const r of recs) {
    if (r.type === "childList") r.addedNodes.forEach(localize);
    else if (r.type === "characterData") l10nText(r.target);
    else if (r.type === "attributes" && L10N_ATTRS.includes(r.attributeName)) l10nAttrs(r.target);
  }
});
function applyLangAttrs() {
  const h = document.documentElement;
  h.lang = LANG; h.dir = LANG === "ar" ? "rtl" : "ltr";
  const b = document.getElementById("lang");
  if (b) { b.textContent = LANG === "ar" ? "English" : "عربي"; b.setAttribute("lang", LANG === "ar" ? "en" : "ar"); b.setAttribute("aria-label", LANG === "ar" ? "Switch to English" : "التبديل إلى العربية"); }
  const md = document.querySelector('meta[name="description"]');
  if (md) md.content = tt("HUDERA AI builds WhatsApp AI assistants, dashboards, workflow automations and SaaS products for businesses in Saudi Arabia and the Gulf.", "تبني HUDERA AI مساعدات واتساب ذكية ولوحات مؤشرات وأتمتة سير العمل ومنتجات SaaS للشركات في السعودية والخليج.");
}
/* WhatsApp links carry both languages so the switch can update them in place */
const waAttr = (en, ar) => `href="${waLink(tt(en, ar))}" data-wa-en="${esc(en)}" data-wa-ar="${esc(ar)}" target="_blank" rel="noopener"`;
function refreshWa() { document.querySelectorAll("[data-wa-en]").forEach(a => { a.href = waLink(LANG === "ar" ? a.dataset.waAr : a.dataset.waEn); }); }
function setLang(v) {
  if (v === LANG) return;
  LANG = v; try { localStorage.setItem("hudera-lang", v); } catch (e) {}
  applyLangAttrs();
  if (LANG === "ar") localize(document.body); else unlocalize(document.body);
  refreshWa();
  if (typeof onLangChange === "function") onLangChange();
}
function startL10n() {
  applyLangAttrs();
  L10N_OBS.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: L10N_ATTRS });
  localize(document.body);
}

/* Arabic search: map an Arabic query back to the English data the demos filter on */
function searchQuery(v) {
  const q = (v || "").trim();
  if (LANG !== "ar" || !L10N_ARABIC.test(q)) return v;
  const keys = [];
  for (const k in AR_DICT) { if (k.length < 60 && !k.includes("#") && AR_DICT[k].includes(q)) keys.push(k.toLowerCase()); }
  if (!keys.length) return v;
  if (keys.length === 1) return keys[0];
  let pre = keys[0]; for (const k of keys) { while (pre && !k.startsWith(pre)) pre = pre.slice(0, -1); }
  return pre.length >= 3 ? pre : keys.sort((a, b) => a.length - b.length)[0];
}

  }
  function auditV(body) {
    body.innerHTML = `<div class="card"><h5>Assistant & team activity <span class="sub">Every action is logged</span></h5><div class="log" style="margin-top:8px">${[...S.audit, { icon: "file", html: "Statement <b>Sep 2026</b> sent to AC-2188", color: "var(--primary-ink)", t: "10:58" }, { icon: "check", html: "AP-1039 <b>approved</b> by Huda", color: "var(--mint)", t: "Yest." }].map(l => `<div class="it"><span style="color:${l.color}">${ic(l.icon)}</span><span>${l.html}</span><time>${l.t}</time></div>`).join("")}</div></div>`;

  buildPhone(); run();
  return { stop: () => eng && eng.stop() };

/* ---------- Attendify: attendance, lateness, overtime ---------- */
function mountAttendify(el, opt = {}) {
  const EMP = [["Khalid Al-Shammari", "Operations"], ["Noura Al-Fahad", "Finance"], ["Ahmed Mansour", "Operations"], ["Sami Haddad", "Workshop"], ["Layla Al-Qassim", "HR"], ["Faisal Al-Dossary", "Workshop"], ["Hana Yousef", "Finance"], ["Majed Al-Rashid", "Operations"], ["Ravi Menon", "Workshop"], ["Dana Al-Hajri", "Procurement"], ["Waleed Saeed", "Operations"], ["Ali Raza", "Workshop"]];
  const DATES = ["Sun 5", "Mon 6", "Tue 7", "Wed 8", "Thu 9", "Sun 12", "Mon 13", "Tue 14"];
  const r = rng(11);
  const LOG = DATES.map(() => EMP.map(() => { const x = r(); if (x < .06) return null; const inMin = 7 * 60 + Math.round(-12 + r() * 40); const out = 16 * 60 + Math.round(r() * 120); return [inMin, out]; }));
  const S = { grace: 15, date: DATES.length - 1, f: "All" };
  const t = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  const status = (rec) => { if (!rec) return "Absent"; const late = rec[0] - 420 > S.grace; const ot = rec[1] - rec[0] - 60 > 9 * 60 + 30; return late ? "Late" : ot ? "Overtime" : "On time"; };
  const STC = { Absent: "red", Late: "amber", Overtime: "violet", "On time": "mint" };
  el.innerHTML = (opt.controls === false ? "" : hint("Change the grace period in Settings and watch lateness recalculate across the dashboard and daily log.")) + browser("app.attendify.demo/dashboard", `<div data-shell></div>`);
  const shell = appShell($("[data-shell]", el), {
    name: "Attendify", icon: "clock", color: "#0B83C5", user: ["Layla Al-Qassim", "HR manager"], searchPh: "Search employees",
    nav: [{ id: "dash", label: "Dashboard", icon: "home" }, { id: "log", label: "Daily log", icon: "calendar", onSearch: () => shell.refresh() }, { id: "set", label: "Settings", icon: "sliders" }],
    render: {
      dash(b) {
        const all = LOG.flat(); const st = all.map(status);
        const pres = all.filter(Boolean).length, late = st.filter(s => s === "Late").length, abs = st.filter(s => s === "Absent").length;
        const ot = Math.round(all.filter(Boolean).reduce((a, x) => a + Math.max(0, x[1] - x[0] - 60 - 540), 0) / 60);

function mountCostPulse(el, opt = {}) {

          <div class="kpis"><div class="kpi"><small>${ic("wallet")}Budget</small><b>${sar(bud / 1000)}k</b><span>${pr.items.length} cost items</span></div><div class="kpi"><small>${ic("money")}Actual to date</small><b>${sar(act / 1000)}k</b><span>Earned ${sar(earned / 1000)}k</span></div><div class="kpi"><small>${ic("chart")}Cost performance</small><b style="color:${cpi < 1 ? "var(--red)" : "var(--mint)"}">${cpi.toFixed(2)}</b><span>${cpi < 1 ? "Spending ahead of progress" : "On or under budget"}</span></div><div class="kpi"><small>${ic("bolt")}Forecast at completion</small><b>${sar(eac / 1000)}k</b><span class="${eac > bud ? "down" : "up"}">${eac > bud ? "+" : ""}${((eac / bud - 1) * 100).toFixed(1)}% vs budget</span></div></div>
          <div class="card"><h5>Earned value vs. actual cost by item <span class="sub">SAR thousands</span></h5>${barChart({ labels: pr.items.map(i => i[0].split(" ")[0]), series: [{ name: "Earned value", data: rows.map(r => Math.round(r.earned / 1000)), color: "var(--chart-4)" }, { name: "Actual cost", data: rows.map(r => Math.round(r.it[3] / 1000)), color: (i) => rows[i].var > S.th ? "var(--red)" : "var(--chart-1)" }] })}${legend([["Earned value", "var(--chart-4)"], ["Actual cost", "var(--chart-1)"], [`Over ${S.th}% threshold`, "var(--red)"]])}</div>
          <div class="tbl-wrap"><table class="t"><thead><tr><th>Cost item</th><th class="r">Budget</th><th class="r">Progress</th><th class="r">Earned</th><th class="r">Actual</th><th class="r">Variance</th></tr></thead><tbody>${rows.sort((x, y) => y.var - x.var).map(r => `<tr><td class="strong">${r.it[0]}</td><td class="r">${sar(r.it[1])}</td><td class="r">${Math.round(r.it[2] * 100)}%</td><td class="r">${sar(r.earned)}</td><td class="r">${sar(r.it[3])}</td><td class="r">${r.var > S.th ? chip("+" + r.var.toFixed(1) + "%", "red", false) : `<span class="${r.var > 0 ? "" : "faint"}">${r.var > 0 ? "+" : ""}${r.var.toFixed(1)}%</span>`}</td></tr>`).join("")}</tbody></table></div>`;
      },
      prod(b) {
        const crews = ["Cutting crew A", "Coring crew B", "Demolition crew C"], units = ["m / day", "cores / day", "m³ / day"], plan = [42, 28, 18];
        const r = rng(5 + S.crew); const days = Array.from({ length: 14 }, (_, i) => `${i + 1}`);

          <div class="card"><h5>Daily output, last 14 days <span class="sub">${units[S.crew]}</span></h5>${lineChart({ labels: days, series: [{ name: "Actual", data: act, color: "var(--chart-1)", area: true }, { name: "Plan", data: days.map(() => plan[S.crew]), color: "var(--chart-3)", dash: true }] })}${legend([["Actual output", "var(--chart-1)"], ["Planned rate", "var(--chart-3)"]])}</div>`;
      },
    },
  });
  el.addEventListener("input", e => { if (e.target.matches("[data-th]")) { S.th = +e.target.value; shell.refresh(); const s = $("[data-th]", el); s && s.focus(); } });
  el.addEventListener("change", e => { if (e.target.matches("[data-proj]")) { S.p = e.target.value; shell.refresh(); } });
  el.addEventListener("click", e => { const c = e.target.closest("[data-crew]"); if (c) { S.crew = +c.dataset.crew; shell.refresh(); } });
}

/* ---------- MatchDesk: invoice vs delivery notes ---------- */

          <div class="grid-2" style="grid-template-columns:repeat(4,minmax(0,1fr))">${[["INV-77341", "inv", "Invoice · 8 lines · SAR 2,946"], ...LINES.filter(l => l[0] !== "—").map(l => [l[0], "dn", l[1]])].map(([n, k, d]) => `<div class="card row" style="gap:10px;align-items:flex-start"><span class="thumb ${k}"></span><div style="min-width:0"><b class="mono" style="font-size:12.5px;color:var(--ink)">${n}</b><div style="font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d}</div>${chip("Read", "mint", false)}</div></div>`).join("")}</div>

          <div class="row between"><div class="seg" role="group" aria-label="Filter">${["All", "Differences", "Matched"].map(f => `<button type="button" data-f="${f}" aria-pressed="${S.f === f}">${f}</button>`).join("")}</div><button class="btn sm" type="button" data-draft>${ic("edit")}Draft supplier query</button></div>

    const ps = $$(".pipe", box);

    const ln = e.target.closest("[data-line]"); if (ln) {
      const l = LINES[+ln.dataset.line];
      shell.drawer(`<header><div><small>${l[0]}</small><h5>${l[1]}</h5></div><button class="x-btn" type="button" data-close aria-label="Close">${ic("x")}</button></header>

        <div class="quote" style="border-color:var(--red)"><small>Finding</small>${l[0] === "—" ? "No signed delivery note for this item in September." : `Invoiced ${l[3] - l[2]} more than received on ${l[0]}.`}</div></div>
        <footer><button class="btn sm primary" type="button" data-draft>${ic("edit")}Draft supplier query</button><button class="btn sm ghost" type="button" data-close>Close</button></footer>`);
      return;

    if (e.target.closest("[data-draft]")) {

      return;
    }
    if (e.target.closest("[data-copydraft]")) copyText(draftText());
  });
  if (opt.view) shell.go(opt.view);
}

        ${A.map(x => `<div class="card row between"><div class="row">${person(x.w[0], x.i)}<span style="font-size:12.5px;color:var(--muted)">${x.doc}</span></div><div class="row">${x.d < 0 ? chip("Expired " + -x.d + "d ago", "red") : chip(x.d + " days left", x.d <= 30 ? "amber" : "grey")}${S.notified.has(x.i) ? chip("Supervisor notified", "mint", false) : `<button class="btn xs" type="button" data-notify="${x.i}">${ic("bell")}Notify supervisor</button>`}</div></div>`).join("")}`;
      },
      rq(b) {
        if (!S.gen) { b.innerHTML = `<div class="card empty">No request generated yet.<div style="margin-top:12px"><button class="btn sm primary" type="button" data-nav="w">Select workers</button></div></div>`; return; }
        const list = [...S.sel].filter(i => st(W[i])[0] !== "Expired").map(i => W[i]);
        b.innerHTML = `<div class="row between">${chip("Ready for submission", "mint")}<button class="btn sm" type="button" data-copyreq>${ic("copy")}Copy worker list</button></div>
        <div class="docprev"><div class="dh"><div><h6>Site Access Request · Workers</h6><small>Project: Northgate Mall extension · Contractor: HUDERA demo company</small></div><small>REQ-0419 · 15 Oct 2026</small></div>
        <table><thead><tr><th>#</th><th>Name</th><th>Trade</th><th>ID number</th><th>ID valid until</th></tr></thead><tbody>${list.map((w, k) => `<tr><td>${k + 1}</td><td>${w[0]}</td><td>${w[1]}</td><td>${mask(W.indexOf(w))}</td><td>${new Date(Date.UTC(2026, 9, 15) + w[2] * 864e5).toISOString().slice(0, 10)}</td></tr>`).join("")}</tbody></table>
        <div class="sig"><span>Fields filled from documents · checked by site administrator</span><span>Attachments: ${list.length} ID copies</span></div></div>`;
      },
    },
  });
  el.addEventListener("click", e => {
    if (e.target.matches("[data-pick]")) { const i = +e.target.dataset.pick; e.target.checked ? S.sel.add(i) : S.sel.delete(i); shell.refresh(); return; }
    if (e.target.closest("[data-gen]")) { S.gen = true; const ex = [...S.sel].filter(i => st(W[i])[0] === "Expired").length; toast(`Request REQ-0419 generated${ex ? ` · ${ex} expired worker excluded` : ""}`); shell.go("rq"); return; }
    const n = e.target.closest("[data-notify]"); if (n) { S.notified.add(+n.dataset.notify); toast("Supervisor notified by WhatsApp"); shell.badge("al", Math.max(0, 3 - S.notified.size)); shell.refresh(); return; }
    if (e.target.closest("[data-copyreq]")) { copyText([...S.sel].map(i => W[i][0] + " · " + W[i][1]).join("\n")); return; }
    const r = e.target.closest("[data-w]"); if (r) {
      const i = +r.dataset.w, w = W[i], s = st(w);
      shell.drawer(`<header><div><small>Worker file</small><h5>${w[0]}</h5></div><button class="x-btn" type="button" data-close aria-label="Close">${ic("x")}</button></header>
        <div class="db"><div class="row"><span class="thumb id"></span>${w[3] != null ? '<span class="thumb id"></span>' : ""}<span style="font-size:12px;color:var(--faint)">Scanned documents</span></div>
        <div class="card"><h5>Fields read from the ID document</h5><dl class="kv" style="margin-top:8px"><dt>Name</dt><dd>${w[0]}</dd><dt>ID number</dt><dd class="mono">${mask(i)}</dd><dt>Occupation</dt><dd>${w[1]}</dd><dt>Expiry</dt><dd>${new Date(Date.UTC(2026, 9, 15) + w[2] * 864e5).toISOString().slice(0, 10)}</dd><dt>Confidence</dt><dd>${(96 + (i % 4)).toFixed(0)}%</dd></dl></div>
        ${w[3] != null ? `<div class="card"><h5>Driving licence</h5><dl class="kv" style="margin-top:8px"><dt>Expiry</dt><dd>${new Date(Date.UTC(2026, 9, 15) + w[3] * 864e5).toISOString().slice(0, 10)}</dd><dt>Status</dt><dd>${w[3] < 0 ? chip("Expired", "red") : chip("Valid", "mint")}</dd></dl></div>` : ""}
        <div>${chip(s[0], s[1])}</div></div><footer><button class="btn sm ghost" type="button" data-close>Close</button></footer>`);
    }
  });
  if (opt.view) shell.go(opt.view);
}

function initTheme() {
  const btn = $("#theme"); let t = null;
  try { t = localStorage.getItem("hudera-theme"); } catch (e) {}
  const apply = v => { if (v) document.documentElement.setAttribute("data-theme", v); else document.documentElement.removeAttribute("data-theme"); const dark = v ? v === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; btn.innerHTML = ic(dark ? "sun" : "moon"); btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme"); };
  apply(t);
  btn.addEventListener("click", () => { const dark = document.documentElement.getAttribute("data-theme") ? document.documentElement.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; t = dark ? "light" : "dark"; try { localStorage.setItem("hudera-theme", t); } catch (e) {} apply(t); });
}
